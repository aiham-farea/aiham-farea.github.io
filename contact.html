        <!-- نص الترحيب فوق النموذج -->
        <p class="form-intro">لديك سؤال او فكرة أو تريد فقط إلقاء التحية؟ أرسل رسالة</p>

        <!-- نموذج التواصل -->
        <form class="contact-form">
            <!-- حقل الاسم -->
            <div class="form-group">
                <label for="name">الاسم</label>
                <input type="text" id="name" placeholder="اسمك" required>
            </div>

            <!-- حقل البريد الإلكتروني -->
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="بريدك الالكتروني" required>
            </div>

            <!-- حقل الموضوع -->
            <div class="form-group">
                <label for="subject">الموضوع</label>
                <input type="text" id="subject" placeholder="موضوع الرساله" required>
            </div>

            <!-- حقل الرسالة -->
            <div class="form-group">
                <label for="message">الرسالة</label>
                <textarea id="message" rows="5" placeholder="اكتب رسالتك" required></textarea>
            </div>

            <!-- زر الإرسال -->
            <button type="submit" class="btn">إرسال الرسالة</button>
        </form>
    </section>
